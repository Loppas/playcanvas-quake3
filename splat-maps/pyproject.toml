[project]
name = "splat-maps"
version = "0.0.0"
description = "Gaussian-splat captures to Quake 3 maps for playcanvas-quake3"
# numpy below 2 has no wheels past 3.12.
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy<2",
    "Pillow",
    "scipy",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts/windows"]
