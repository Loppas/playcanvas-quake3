name: Stage
description: A stage of planned work, which one pull request delivers.
labels: [stage]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What the stage delivers, in a sentence or two.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Each part of the stage, as a checklist; what it leaves to a later stage, said.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: accept
    attributes:
      label: Accept
      description: How the stage is proved done — the tests, and any live check.
    validations:
      required: true
  - type: input
    id: estimate
    attributes:
      label: Estimate (h)
      description: Hours of work, as a range.
      placeholder: 2–3
