version: 2
updates:
  # The prefixes keep each pull request's title a Conventional Commit: `build(deps): …`.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /splat-maps
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      uv:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
