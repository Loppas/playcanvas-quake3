name: ci

on:
  pull_request:
    # `edited` re-checks a retitled pull request.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.paths.outputs.app }}
      shell: ${{ steps.paths.outputs.shell }}
      splat-maps: ${{ steps.paths.outputs.splat-maps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # A pull request is checked out as its merge commit, whose first parent is the base. A push
      # to main runs every job.
      - id: paths
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "shell=true" >> "$GITHUB_OUTPUT"
            echo "splat-maps=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          match() { grep -qE "$1" <<< "$changed" && echo true || echo false; }
          # The app's checks run for a change to what they read: the code and its tests, the build
          # and its settings, and the notices the build publishes.
          echo "app=$(match '^(src/|master/|scripts/|electron/|public/|index\.html$|vite(\.[a-z]+)?\.config\.ts$|tsconfig\.json$|package(-lock)?\.json$|\.nvmrc$|electron-builder\.config\.mjs$|LICENSE$|NOTICE$|CREDITS\.md$|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "shell=$(match '^(electron/|scripts/|electron-builder\.config\.mjs$|package(-lock)?\.json$|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "splat-maps=$(match '^(splat-maps/|\.claude/skills/splat-cleanup/|\.github/workflows/)')" >> "$GITHUB_OUTPUT"

  typecheck:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:pages
      - run: npm run build:dedicated
      - run: npm run build:master
      # The hosted master's bundle, made as a deploy makes it, without an account.
      - run: npm run deploy:master -- --dry-run

  shell:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run shell:build

  splat-maps:
    needs: changes
    if: needs.changes.outputs.splat-maps == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: splat-maps
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          working-directory: splat-maps
      - run: uv sync --locked
      - run: uv run python -m compileall -q src ../.claude/skills/splat-cleanup/scripts
      - run: uv run pytest
      # The splat-cleanup skill's scripts import splat_maps, so they are tested in its environment.
      - run: uv run pytest ../.claude/skills/splat-cleanup/tests

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The title becomes the squashed commit's subject, which releases are cut from.
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|docs|refactor|test|chore|perf|build|ci|style|revert'
          if ! grep -qE "^($types)(\([a-z0-9][a-z0-9-]*\))?!?: [^ ].*[^.]$" <<< "$TITLE"; then
            echo "::error::The title is not a Conventional Commit: <type>(<scope>): <description>, the scope and a ! optional, with no trailing full stop. Types: ${types//|/, }."
            exit 1
          fi

  # The one required check: a job skipped by its `if` reports success, and a workflow skipped by
  # a path filter would leave a required check pending.
  ci:
    if: always()
    needs: [changes, typecheck, test, build, shell, splat-maps, pr-title]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
